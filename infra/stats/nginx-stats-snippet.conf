# AyTool 私有流量看板（include 进 aytool.com 443 server 块）
# 生成器: /usr/local/bin/aytool-stats.py (cron 每10分钟)
location = /stats { return 301 /stats/; }

# `^~` is load-bearing, do not drop it. `index` serves /stats/ by internally
# redirecting to /stats/index.html, and an internal redirect re-runs location
# matching — which would hit the canonical `~ ^(.+)/index\.html$` rule in
# nginx-aytool.conf and 301 straight back to /stats/, looping forever. `^~`
# makes this prefix win outright so regex locations are never evaluated.
# Any future location using alias+index needs the same treatment.
location ^~ /stats/ {
    alias /var/www/aytool-stats/;
    index index.html;
    auth_basic "AyTool Stats";
    auth_basic_user_file /etc/nginx/.aytool-stats-htpasswd;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
