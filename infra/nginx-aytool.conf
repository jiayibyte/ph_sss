# AyTool — nginx server config (design.md §6)
# Deploy target layout (atomic releases):
#   /var/www/aytool          -> symlink to /var/www/aytool-releases/<timestamp>
#   /var/www/aytool-releases/<timestamp>/   (dist/ contents)
#
# Place this file at /etc/nginx/sites-available/aytool.conf and symlink into
# sites-enabled. Requires an SSL cert (e.g. certbot certonly -d aytool.com -d www.aytool.com).

# HTTP → HTTPS. The ACME webroot must stay reachable over plain HTTP or
# certbot renewals fail, so redirect from `location /`, never the server block.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name aytool.com www.aytool.com _;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://aytool.com$request_uri; }
}

# www → apex (single canonical hostname)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aytool.com;

    ssl_certificate     /etc/letsencrypt/live/aytool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aytool.com/privkey.pem;

    return 301 https://aytool.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name aytool.com;

    ssl_certificate     /etc/letsencrypt/live/aytool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aytool.com/privkey.pem;

    root /var/www/aytool;
    index index.html;

    # ---- Compression (prefer brotli if the module is available) ----
    gzip on;
    # text/html is always gzipped when gzip is on — listing it here would only
    # trigger nginx's "duplicate MIME type" warning.
    gzip_types text/css application/javascript application/json
               image/svg+xml application/xml text/plain;
    gzip_min_length 512;
    gzip_vary on;
    # brotli on;              # uncomment if ngx_brotli is installed
    # brotli_types text/html text/css application/javascript application/json image/svg+xml;

    # ---- Security headers (money-topic trust baseline) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: 'unsafe-inline' needed for Astro's inlined CSS + JSON-LD; GA4/Partytown hosts allowed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; img-src 'self' data: https://*.google-analytics.com; frame-ancestors 'self'" always;

    # ---- Fingerprinted build assets: cache forever ----
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Partytown worker files (fingerprint-less but versioned by deploy)
    location /~partytown/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- HTML & everything else: short edge TTL + ETag ----
    # CDN edge caches for 10 min; deploys purge the CDN explicitly.

    # Crawlers probe /sitemap.xml by convention; Astro emits sitemap-index.xml.
    location = /sitemap.xml {
        return 301 https://aytool.com/sitemap-index.xml;
    }

    # Canonical URL normalization. Astro emits directory-style URLs, so do not
    # serve duplicate 200 responses for /index.html or missing trailing slashes.
    location = /index.html {
        return 301 https://aytool.com/$is_args$args;
    }
    location ~ ^(.+)/index\.html$ {
        return 301 https://aytool.com$1/$is_args$args;
    }
    location ~ ^/[^.]*[^/]$ {
        return 301 https://aytool.com$uri/$is_args$args;
    }

    location / {
        add_header Cache-Control "public, max-age=600";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; img-src 'self' data: https://*.google-analytics.com; frame-ancestors 'self'" always;
        etag on;
        try_files $uri $uri/index.html =404;
    }

    # Private traffic dashboard at /stats/ (basic-auth, cron-generated).
    # Snippet lives at /etc/nginx/snippets/aytool-stats.conf — source of truth
    # is infra/stats/nginx-stats-snippet.conf in this repo.
    include snippets/aytool-stats.conf;

    # Custom 404 (Astro emits dist/404.html at the web root)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- Logging (AI-bot crawl stats are a GEO leading indicator) ----
    access_log /var/log/nginx/aytool.access.log;
    error_log  /var/log/nginx/aytool.error.log;
}

# Monthly AI-bot crawl report (design.md §5.4 measurement layer):
#   grep -iE "GPTBot|ClaudeBot|PerplexityBot|Google-Extended" /var/log/nginx/aytool.access.log* \
#     | awk '{print $1}' | sort | uniq -c | sort -rn
